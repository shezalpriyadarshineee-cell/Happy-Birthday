<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Little Surprise 💗</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: white;
            font-family: "Trebuchet MS", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Colourful stars */
        .star {
            position: fixed;
            font-size: 25px;
            animation: float 3s ease-in-out infinite;
            user-select: none;
        }

        .star1  { top: 8%;  left: 12%; color: #ff6b6b; }
        .star2  { top: 15%; left: 35%; color: #ffd43b; }
        .star3  { top: 7%;  right: 15%; color: #74c0fc; }
        .star4  { top: 30%; left: 7%;  color: #69db7c; }
        .star5  { top: 27%; right: 8%; color: #da77f2; }
        .star6  { bottom: 20%; left: 12%; color: #4dabf7; }
        .star7  { bottom: 10%; left: 38%; color: #ff8787; }
        .star8  { bottom: 18%; right: 12%; color: #ffd43b; }
        .star9  { bottom: 35%; right: 5%; color: #69db7c; }
        .star10 { top: 48%; left: 20%; color: #da77f2; }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-8px) rotate(8deg);
            }
        }

        .container {
            width: 90%;
            max-width: 600px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        /* Cute bunny */
        .bunny {
            font-size: 100px;
            margin-bottom: 10px;
            animation: bunnyBounce 2s ease-in-out infinite;
        }

        @keyframes bunnyBounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        h1 {
            font-size: 32px;
            font-weight: 600;
            color: #333;
            margin: 10px 0 15px;
        }

        p {
            font-size: 20px;
            color: #555;
            margin: 0 0 30px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        button {
            font-family: inherit;
            font-size: 17px;
            padding: 12px 28px;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        #yesButton {
            background: #ff8fab;
            color: white;
            border: 2px solid #ff8fab;
            position: relative;
            z-index: 10;
        }

        #yesButton:hover {
            transform: scale(1.08);
        }

        #noButton {
            background: white;
            color: #555;
            border: 2px solid #aaa;
            position: fixed;
            z-index: 20;
        }

        /* Sad cat screen */

        #sadScreen {
            display: none;
        }

        .sad-cat {
            width: 220px;
            max-width: 70vw;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        #finalYes {
            background: #ff8fab;
            color: white;
            border: 2px solid #ff8fab;
            position: relative;
        }

        /* Second page */

        #pageTwo {
            display: none;
        }

        #nextButton {
            background: white;
            border: 2px solid #ff8fab;
            color: #ff6f91;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 25px;
            }

            p {
                font-size: 18px;
            }

            .bunny {
                font-size: 80px;
            }
        }
    </style>
</head>

<body>

    <!-- Colourful stars -->
    <div class="star star1">★</div>
    <div class="star star2">★</div>
    <div class="star star3">★</div>
    <div class="star star4">★</div>
    <div class="star star5">★</div>
    <div class="star star6">★</div>
    <div class="star star7">★</div>
    <div class="star star8">★</div>
    <div class="star star9">★</div>
    <div class="star star10">★</div>


    <div class="container">

        <!-- FIRST PAGE -->

        <div id="firstScreen">

            <div class="bunny">🐰</div>

            <h1>
                I made something for you. 💗
            </h1>

            <p>
                Do you wanna see it?
            </p>

            <div class="buttons">

                <button id="yesButton">
                    YES ♡
                </button>

                <button id="noButton">
                    NO 😳
                </button>

            </div>

        </div>


        <!-- SAD CAT PAGE -->

        <div id="sadScreen">

            <div style="font-size: 90px;">
                😿
            </div>

            <h1>
                Are you sure? 🥺
            </h1>

            <p>
                Do you really not want to see it?
            </p>

            <button id="finalYes">
                Okay... YES ♡
            </button>

        </div>


        <!-- PAGE TWO -->

        <div id="pageTwo">

            <div style="font-size: 90px;">
                💌
            </div>

            <h1>
                I knew you'd say yes! ♡
            </h1>

            <p>
                I made this little surprise especially for you.
            </p>

            <button id="nextButton">
                NEXT →
            </button>

        </div>

    </div>


    <script>

        let noClicks = 0;

        const noButton = document.getElementById("noButton");
        const yesButton = document.getElementById("yesButton");

        const firstScreen = document.getElementById("firstScreen");
        const sadScreen = document.getElementById("sadScreen");
        const pageTwo = document.getElementById("pageTwo");

        const finalYes = document.getElementById("finalYes");


        // Make NO run away when the mouse gets close
        noButton.addEventListener("mouseenter", runAway);


        // Also move it if he manages to click it
        noButton.addEventListener("click", runAway);


        function runAway() {

            noClicks++;

            const buttonWidth = noButton.offsetWidth;
            const buttonHeight = noButton.offsetHeight;

            const maxX = window.innerWidth - buttonWidth - 20;
            const maxY = window.innerHeight - buttonHeight - 20;

            const randomX = Math.max(10, Math.random() * maxX);
            const randomY = Math.max(10, Math.random() * maxY);

            noButton.style.left = randomX + "px";
            noButton.style.top = randomY + "px";


            // After five attempts, show the sad screen
            if (noClicks >= 5) {

                firstScreen.style.display = "none";

                sadScreen.style.display = "block";

            }
        }


        // YES button
        yesButton.addEventListener("click", function() {

            firstScreen.style.display = "none";

            pageTwo.style.display = "block";

        });


        // YES after sad cat
        finalYes.addEventListener("click", function() {

            sadScreen.style.display = "none";

            pageTwo.style.display = "block";

        });

    </script>

</body>
</html>
