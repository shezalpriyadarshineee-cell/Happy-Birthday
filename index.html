<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Surprise ❤️</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffd6e7, #fff4f8);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.container {
    width: 90%;
    max-width: 500px;
    text-align: center;
}

.gift {
    font-size: 90px;
    margin-bottom: 15px;
}

h1 {
    color: #d6336c;
    font-size: 28px;
}

p {
    color: #555;
    font-size: 19px;
}

.buttons {
    margin-top: 30px;
    display: flex;
    justify-content: center;
    gap: 20px;
}

button {
    border: none;
    padding: 14px 28px;
    border-radius: 30px;
    font-size: 18px;
    cursor: pointer;
}

#yesButton {
    background: #ff4f81;
    color: white;
}

#noButton {
    background: #dddddd;
    color: #333;
    position: fixed;
}

#sadScreen {
    display: none;
}

.cat {
    font-size: 90px;
}

#finalYes {
    background: #ff4f81;
    color: white;
    margin-top: 20px;
}

</style>
</head>

<body>

<div class="container">

    <!-- FIRST SCREEN -->

    <div id="firstScreen">

        <div class="gift">🎁</div>

        <h1>I made something for you. 💌</h1>

        <p>Do you want to see it?</p>

        <div class="buttons">

            <button id="yesButton">
                YES ❤️
            </button>

            <button id="noButton">
                NO 😐
            </button>

        </div>

    </div>


    <!-- SAD CAT SCREEN -->

    <div id="sadScreen">

        <div class="cat">
            😿
        </div>

        <h1>Are you sure? 🥺</h1>

        <p>
            Do you really not want to see it?
        </p>

        <button id="finalYes">
            Okay... YES ❤️
        </button>

    </div>


    <!-- NEXT PAGE -->

    <div id="pageTwo" style="display:none;">

        <div style="font-size:80px;">
            💌
        </div>

        <h1>
            I knew you'd say yes! ❤️
        </h1>

        <p>
            I made this little website especially for you.
        </p>

        <button id="nextButton">
            NEXT →
        </button>

    </div>

</div>


<script>

let noClicks = 0;

const noButton = document.getElementById("noButton");

const yesButton = document.getElementById("yesButton");

const firstScreen = document.getElementById("firstScreen");

const sadScreen = document.getElementById("sadScreen");

const finalYes = document.getElementById("finalYes");

const pageTwo = document.getElementById("pageTwo");


// NO BUTTON

noButton.addEventListener("click", function() {

    noClicks++;

    // Move the button somewhere random
    const maxX = window.innerWidth - noButton.offsetWidth - 20;
    const maxY = window.innerHeight - noButton.offsetHeight - 20;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    noButton.style.left = x + "px";
    noButton.style.top = y + "px";


    // After 5 attempts show sad cat
    if (noClicks >= 5) {

        setTimeout(function() {

            firstScreen.style.display = "none";

            sadScreen.style.display = "block";

        }, 400);

    }

});


// YES BUTTON

yesButton.addEventListener("click", function() {

    firstScreen.style.display = "none";

    pageTwo.style.display = "block";

});


// SAD CAT YES BUTTON

finalYes.addEventListener("click", function() {

    sadScreen.style.display = "none";

    pageTwo.style.display = "block";

});

</script>

</body>
</html>
