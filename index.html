<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Surprise ♡</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: white;
            font-family: "Trebuchet MS", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* =========================
           COLOURFUL STARS
        ========================= */

        .star {
            position: fixed;
            font-size: 25px;
            user-select: none;
            animation: twinkle 2.5s ease-in-out infinite;
            z-index: 1;
        }

        .star1 {
            top: 8%;
            left: 10%;
            color: #ff6b6b;
        }

        .star2 {
            top: 15%;
            left: 30%;
            color: #ffd43b;
            animation-delay: .5s;
        }

        .star3 {
            top: 7%;
            right: 15%;
            color: #74c0fc;
            animation-delay: 1s;
        }

        .star4 {
            top: 30%;
            left: 7%;
            color: #69db7c;
            animation-delay: 1.5s;
        }

        .star5 {
            top: 25%;
            right: 8%;
            color: #da77f2;
            animation-delay: .7s;
        }

        .star6 {
            bottom: 20%;
            left: 12%;
            color: #4dabf7;
            animation-delay: 1.2s;
        }

        .star7 {
            bottom: 10%;
            left: 38%;
            color: #ff8787;
            animation-delay: .3s;
        }

        .star8 {
            bottom: 18%;
            right: 12%;
            color: #ffd43b;
            animation-delay: 1.7s;
        }

        .star9 {
            bottom: 35%;
            right: 5%;
            color: #69db7c;
            animation-delay: .9s;
        }

        .star10 {
            top: 50%;
            left: 20%;
            color: #da77f2;
            animation-delay: 1.4s;
        }
        .star11 {
    top: 12%;
    left: 55%;
    color: #ff8fab;
    font-size: 16px;
}

.star12 {
    top: 20%;
    left: 80%;
    color: #ffd43b;
    font-size: 18px;
}

.star13 {
    top: 42%;
    left: 10%;
    color: #74c0fc;
    font-size: 14px;
}

.star14 {
    top: 38%;
    left: 88%;
    color: #da77f2;
    font-size: 20px;
}

.star15 {
    top: 60%;
    left: 5%;
    color: #ff8787;
    font-size: 17px;
}

.star16 {
    top: 65%;
    left: 28%;
    color: #69db7c;
    font-size: 13px;
}

.star17 {
    top: 55%;
    right: 25%;
    color: #ffd43b;
    font-size: 16px;
}

.star18 {
    top: 75%;
    right: 7%;
    color: #74c0fc;
    font-size: 14px;
}

.star19 {
    bottom: 7%;
    right: 35%;
    color: #da77f2;
    font-size: 19px;
}

.star20 {
    bottom: 45%;
    left: 35%;
    color: #ff8fab;
    font-size: 12px;
}

.star21 {
    top: 33%;
    left: 48%;
    color: #69db7c;
    font-size: 15px;
}

.star22 {
    bottom: 28%;
    left: 50%;
    color: #4dabf7;
    font-size: 18px;
}

.star23 {
    top: 85%;
    left: 18%;
    color: #ffd43b;
    font-size: 13px;
}

.star24 {
    top: 10%;
    right: 40%;
    color: #ff8787;
    font-size: 15px;
}

        @keyframes twinkle {
            0%, 100% {
                opacity: .55;
                transform: scale(1) rotate(0deg);
            }

            50% {
                opacity: 1;
                transform: scale(1.2) rotate(10deg);
            }
        }


        /* =========================
           MAIN
        ========================= */

        .container {
            width: 90%;
            max-width: 600px;
            text-align: center;
            position: relative;
            z-index: 5;
        }


        /* =========================
           BUNNY
        ========================= */

        .bunny {
            display: block;
            width: auto;
            height: 300px;
            max-width: 80vw;
            margin: 0 auto 5px;
            object-fit: contain;

            animation: bunnyBounce 3s ease-in-out infinite;
        }

        @keyframes bunnyBounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }


        /* =========================
           TEXT
        ========================= */

        h1 {
            font-size: 30px;
            font-weight: 600;
            color: #333;
            margin: 5px 0 12px;
        }

        p {
            font-size: 20px;
            color: #555;
            margin: 0 0 28px;
        }


        /* =========================
           BUTTONS
        ========================= */

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            min-height: 55px;
        }

        button {
            font-family: inherit;
            font-size: 17px;
            padding: 11px 27px;
            border-radius: 25px;
            cursor: pointer;
            transition: transform .2s ease;
        }

        #yesButton {
            background: #ff8fab;
            color: white;
            border: 2px solid #ff8fab;
            position: relative;
            z-index: 10;
        }

        #yesButton:hover {
            transform: scale(1.08);
        }

        /*
           NO starts normally beside YES.
           JavaScript changes it to fixed
           when it runs away.
        */

        #noButton {
            background: white;
            color: #555;
            border: 2px solid #aaa;
            position: relative;
            z-index: 20;
        }


        /* =========================
           SAD CAT SCREEN
        ========================= */

        #sadScreen {
            display: none;
        }

        .cat {
            width: 280px;
            max-width: 75vw;
            max-height: 45vh;
            object-fit: contain;
            display: block;
            margin: 0 auto 10px;

            animation: catAppear .7s ease;
        }

        @keyframes catAppear {
            from {
                opacity: 0;
                transform: scale(.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        #finalYes {
            background: #ff8fab;
            color: white;
            border: 2px solid #ff8fab;
        }

        #finalYes:hover {
            transform: scale(1.08);
        }


        /* =========================
           SECOND PAGE
        ========================= */

        #pageTwo {
            display: none;
        }

       .happy-image {
    width: 280px;
    max-width: 75vw;
    max-height: 350px;
    object-fit: contain;
    display: block;
    margin: 0 auto 15px;
}

        #nextButton {
            background: white;
            border: 2px solid #ff8fab;
            color: #ff6f91;
        }

        #nextButton:hover {
            transform: scale(1.08);
        }


        /* =========================
           PHONE
        ========================= */

        @media (max-width: 600px) {

            .bunny {
                height: 250px;
            }

            h1 {
                font-size: 25px;
            }

            p {
                font-size: 18px;
            }

            button {
                font-size: 16px;
                padding: 10px 23px;
            }

            .star {
                font-size: 20px;
            }
        }

    </style>
</head>


<body>

    <!-- COLOURFUL STARS -->

    <div class="star star1">★</div>
    <div class="star star2">★</div>
    <div class="star star3">★</div>
    <div class="star star4">★</div>
    <div class="star star5">★</div>
    <div class="star star6">★</div>
    <div class="star star7">★</div>
    <div class="star star8">★</div>
    <div class="star star9">★</div>
    <div class="star star10">★</div>
    <div class="star star11">★</div>
<div class="star star12">★</div>
<div class="star star13">★</div>
<div class="star star14">★</div>
<div class="star star15">★</div>
<div class="star star16">★</div>
<div class="star star17">★</div>
<div class="star star18">★</div>
<div class="star star19">★</div>
<div class="star star20">★</div>
<div class="star star21">★</div>
<div class="star star22">★</div>
<div class="star star23">★</div>
<div class="star star24">★</div>


    <div class="container">


        <!-- =========================
             FIRST PAGE
        ========================== -->

        <div id="firstScreen">

            <img
                src="bunny.png"
                class="bunny"
                alt="Cute bunny holding flowers"
            >

            <h1>
                I made something for you. ♡
            </h1>

            <p>
                Do you wanna see it?
            </p>


            <div class="buttons">

                <button id="yesButton">
                    YES ♡
                </button>

                <button id="noButton">
                    NO 😳
                </button>

            </div>

        </div>


        <!-- =========================
             SAD CAT PAGE
        ========================== -->

        <div id="sadScreen">

            <img
                src="cat.png"
                class="cat"
                alt="Sad watery-eyed cat"
            >

            <h1>
                Are you sure? 🥺
            </h1>

            <p>
                Do you really not want to see it?
            </p>

            <button id="finalYes">
                Okay... YES ♡
            </button>

        </div>


        <!-- =========================
             PAGE TWO
        ========================== -->

        <div id="pageTwo">

            <img
    src="happy.png"
    alt="Happy illustration"
    class="happy-image"
>

            <h1>
                I knew you'd say yes! ♡
            </h1>

            <p>
                I made this little surprise
                especially for you.
            </p>

            <button id="nextButton">
                NEXT →
            </button>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        let noClicks = 0;

        const noButton =
            document.getElementById("noButton");

        const yesButton =
            document.getElementById("yesButton");

        const firstScreen =
            document.getElementById("firstScreen");

        const sadScreen =
            document.getElementById("sadScreen");

        const pageTwo =
            document.getElementById("pageTwo");

        const finalYes =
            document.getElementById("finalYes");


        /* =========================
           NO BUTTON RUNS AWAY
        ========================== */

        function runAway() {

            noClicks++;

            /*
               Change NO from its normal
               position into a floating
               position on the screen.
            */

            noButton.style.position = "fixed";

            const buttonWidth =
                noButton.offsetWidth;

            const buttonHeight =
                noButton.offsetHeight;


            const maxX =
                window.innerWidth -
                buttonWidth -
                20;

            const maxY =
                window.innerHeight -
                buttonHeight -
                20;


            const randomX =
                Math.max(
                    10,
                    Math.random() * maxX
                );


            const randomY =
                Math.max(
                    10,
                    Math.random() * maxY
                );


            noButton.style.left =
                randomX + "px";

            noButton.style.top =
                randomY + "px";


            /*
               After 5 attempts,
               show the sad cat.
            */

            if (noClicks >= 5) {

                firstScreen.style.display =
                    "none";

                sadScreen.style.display =
                    "block";

            }
        }


        /*
           On laptop:
           when the mouse gets close,
           NO runs away.
        */

        noButton.addEventListener(
            "mouseenter",
            runAway
        );


        /*
           If he somehow manages
           to click NO...
        */

        noButton.addEventListener(
            "click",
            runAway
        );


        /* =========================
           YES
        ========================== */

        yesButton.addEventListener(
            "click",
            function() {

                firstScreen.style.display =
                    "none";

                pageTwo.style.display =
                    "block";
            }
        );


        /* =========================
           YES AFTER CAT
        ========================== */

        finalYes.addEventListener(
            "click",
            function() {

                sadScreen.style.display =
                    "none";

                pageTwo.style.display =
                    "block";
            }
        );

    </script>

</body>
</html>
