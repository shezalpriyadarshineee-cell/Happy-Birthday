<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Little Surprise ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffe0ec, #fff5f8);
            overflow: hidden;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 500px;
        }

        .gift {
            font-size: 90px;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }

        h1 {
            color: #d6336c;
            font-size: 30px;
            margin: 20px 0 10px;
        }

        p {
            color: #555;
            font-size: 19px;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            border: none;
            padding: 13px 30px;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }

        #yesBtn {
            background: #ff4f81;
            color: white;
        }

        #yesBtn:hover {
            transform: scale(1.08);
        }

        #noBtn {
            background: #ddd;
            color: #444;
            position: relative;
        }

        .sad-cat {
            display: none;
            font-size: 80px;
            margin-bottom: 15px;
        }

        .hidden {
            display: none;
        }

        #message {
            display: none;
        }

        #finalYes {
            background: #ff4f81;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- FIRST SCREEN -->
        <div id="firstScreen">

            <div class="gift">🎁</div>

            <h1>I made something for you. 💌</h1>

            <p>Do you want to see it?</p>

            <div class="buttons">
                <button id="yesBtn">Yes ❤️</button>
                <button id="noBtn">No 😐</button>
            </div>

        </div>


        <!-- SAD CAT SCREEN -->
        <div id="message">

            <div class="sad-cat" id="sadCat">😿</div>

            <h1>Are you sure? 🥺</h1>

            <p>Do you really not want to see it?</p>

            <button id="finalYes">Okay... Yes ❤️</button>

        </div>

    </div>


    <script>

        const noBtn = document.getElementById("noBtn");
        const firstScreen = document.getElementById("firstScreen");
        const message = document.getElementById("message");
        const sadCat = document.getElementById("sadCat");
        const yesBtn = document.getElementById("yesBtn");
        const finalYes = document.getElementById("finalYes");

        let attempts = 0;


        // Make the NO button run away
        noBtn.addEventListener("mouseover", moveNoButton);

        // Also works on phones when he touches it
        noBtn.addEventListener("touchstart", moveNoButton);


        function moveNoButton(event) {

            event.preventDefault();

            attempts++;

            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;

            const randomX = Math.max(10, Math.random() * maxX);
            const randomY = Math.max(10, Math.random() * maxY);

            noBtn.style.position = "fixed";
            noBtn.style.left = randomX + "px";
            noBtn.style.top = randomY + "px";


            // After several attempts, show the sad cat
            if (attempts >= 5) {

                setTimeout(function() {

                    firstScreen.style.display = "none";

                    message.style.display = "block";

                    sadCat.style.display = "block";

                }, 500);

            }
        }


        // YES button
        yesBtn.addEventListener("click", function() {

            alert("I knew you'd say yes! ❤️");

            // We'll replace this with the next page later.

        });


        // Final YES button
        finalYes.addEventListener("click", function() {

            alert("Okay! Let's see your surprise! ❤️");

            // We'll connect this to the next page later.

        });

    </script>

</body>
</html>
